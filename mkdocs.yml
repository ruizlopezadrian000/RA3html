site_name: Guía básica de HTML
site_url: https://github.io
theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: amber

  nav:
   - Inicio (es): indexES.md
   - Introducción (es): introduccionES.md
   - Instalación y requisitos (es): instalacionES.md
   - Uso y funcionamiento (es): funcionamientoES.md
   - Conclusiones o mejoras futuras (es): conclusionesES.md

  markdown_extensions:
   - admonition
   - codehilite
